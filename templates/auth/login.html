{% load static %}<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<title>Login - Cyber Intelligence Platform</title>

	<link href="{% static 'assets/fonts/inter/inter.css' %}" rel="stylesheet" type="text/css">
	<link href="{% static 'assets/icons/phosphor/styles.min.css' %}" rel="stylesheet" type="text/css">
	<link href="{% static 'assets/css/ltr/all.min.css' %}" id="stylesheet" rel="stylesheet" type="text/css">
	<link href="{% static 'assets/css/_login.css' %}" rel="stylesheet" type="text/css">

	<script src="{% static 'assets/demo/demo_configurator.js' %}"></script>
	<script src="{% static 'assets/js/bootstrap/bootstrap.bundle.min.js' %}"></script>
	<script src="{% static 'assets/js/app.js' %}"></script>
	<script src="{% static 'assets/js/auth/_login.js' %}"></script>
</head>

<body>

	<!-- Page content -->
	<div class="page-content">

		<!-- Main content -->
		<div class="content-wrapper">

			<!-- Inner content -->
			<div class="content-inner">

				<!-- Content area -->
				<div class="content d-flex justify-content-center align-items-center">

					<!-- Login form -->
					<form class="login-form" id="login-form" method="post" action="{% url 'cyber:login' %}" novalidate>
						{% csrf_token %}
						<div class="card mb-0">
							<div class="card-body">
								<div class="text-center mb-3">
									<h5 class="mb-0 fw-bold">Cyber Intelligence Platform</h5>
									<span class="d-block text-muted">Sign in to your account to continue</span>
								</div>

								{% if error %}
								<div class="alert alert-danger alert-dismissible fade show mb-3" role="alert">
									<i class="ph-warning-circle me-2"></i>{{ error }}
									<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
								</div>
								{% endif %}

							<div class="mb-3">
								<label class="form-label fw-semibold" for="username">Username <span class="text-danger">*</span></label>
								<div class="form-control-feedback form-control-feedback-start">
									<input type="text" class="form-control" name="username" id="username" placeholder="Enter your username" autocomplete="username">
									<div class="form-control-feedback-icon">
										<i class="ph-user-circle text-muted"></i>
									</div>
									<div class="invalid-feedback" id="username-error">Username is required.</div>
								</div>
							</div>

							<div class="mb-3">
								<label class="form-label fw-semibold" for="password">Password <span class="text-danger">*</span></label>
								<div class="form-control-feedback form-control-feedback-start">
									<input type="password" class="form-control" name="password" id="password" placeholder="Enter your password" autocomplete="current-password">
									<div class="form-control-feedback-icon">
										<i class="ph-lock text-muted"></i>
									</div>
									<div class="invalid-feedback" id="password-error">Password is required.</div>
								</div>
							</div>

								<div class="mb-3">
									<button type="submit" class="btn btn-dark-blue w-100">
										<i class="ph-sign-in me-2"></i>Sign in
									</button>
								</div>
							</div>
						</div>
					</form>
					<!-- /login form -->

				</div>
				<!-- /content area -->

				<!-- Footer -->
				<!-- <div class="navbar navbar-sm navbar-footer border-top">
					<div class="container-fluid">
						<span>&copy; {% now "Y" %} Cyber Intelligence Platform</span>
					</div>
				</div> -->
				<!-- /footer -->

			</div>
			<!-- /inner content -->

		</div>
		<!-- /main content -->

	</div>
	<!-- /page content -->



</body>
</html>
