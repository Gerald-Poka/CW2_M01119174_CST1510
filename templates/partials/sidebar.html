{% load static %}
<!-- Main sidebar -->
<div class="sidebar sidebar-dark sidebar-main sidebar-expand-lg">

	<!-- Sidebar header -->
	<div class="sidebar-section bg-black bg-opacity-10 border-bottom border-bottom-white border-opacity-10">
		<div class="sidebar-logo d-flex justify-content-center align-items-center">
			<a href="{% url 'cyber:dashboard' %}" class="d-inline-flex align-items-center py-2">
				<img src="{% static 'assets/images/logo_icon.svg' %}" class="sidebar-logo-icon" alt="">
				<img src="{% static 'assets/images/logo_text_light.svg' %}" class="sidebar-resize-hide ms-3" height="14" alt="">
			</a>

			<div class="sidebar-resize-hide ms-auto">
				<button type="button" class="btn btn-flat-white btn-icon btn-sm rounded-pill border-transparent sidebar-control sidebar-main-resize d-none d-lg-inline-flex">
					<i class="ph-arrows-left-right"></i>
				</button>

				<button type="button" class="btn btn-flat-white btn-icon btn-sm rounded-pill border-transparent sidebar-mobile-main-toggle d-lg-none">
					<i class="ph-x"></i>
				</button>
			</div>
		</div>
	</div>
	<!-- /sidebar header -->

	<!-- Sidebar content -->
	<div class="sidebar-content">

		<!-- Main navigation -->
		<div class="sidebar-section">
			<ul class="nav nav-sidebar" data-nav-type="accordion">

				<li class="nav-item-header">
					<div class="text-uppercase fs-sm lh-sm opacity-50 sidebar-resize-hide">Main</div>
					<i class="ph-dots-three sidebar-resize-show"></i>
				</li>

				{% with active=request.resolver_match.url_name %}
				<li class="nav-item">
					<a href="{% url 'cyber:dashboard' %}" class="nav-link {% if active == 'dashboard' %}active{% endif %}">
						<i class="ph-house"></i>
						<span>Dashboard</span>
					</a>
				</li>
				<li class="nav-item">
					<a href="{% url 'cyber:ai_assistant' %}" class="nav-link {% if active == 'ai_assistant' %}active{% endif %}">
						<i class="ph-chat-circle"></i>
						<span>AI Assistant</span>
					</a>
				</li>
				<li class="nav-item">
					<a href="{% url 'cyber:cyber_agent' %}" class="nav-link {% if active == 'cyber_agent' %}active{% endif %}">
						<i class="ph-robot"></i>
						<span>Cyber Agent</span>
					</a>
				</li>
				<li class="nav-item">
					<a href="{% url 'cyber:analysis_reports' %}" class="nav-link {% if active == 'analysis_reports' %}active{% endif %}">
						<i class="ph-chart-bar"></i>
						<span>Analysis Reports</span>
					</a>
				</li>

				<li class="nav-item-header">
					<div class="text-uppercase fs-sm lh-sm opacity-50 sidebar-resize-hide">Account</div>
					<i class="ph-dots-three sidebar-resize-show"></i>
				</li>

				<li class="nav-item">
					<a href="{% url 'cyber:profile' %}" class="nav-link {% if active == 'profile' %}active{% endif %}">
						<i class="ph-user"></i>
						<span>Profile</span>
					</a>
				</li>

				{% if request.session.role == 'admin' %}
				<li class="nav-item">
					<a href="{% url 'cyber:admin_management' %}" class="nav-link {% if active == 'admin_management' %}active{% endif %}">
						<i class="ph-shield-check"></i>
						<span>Admin Management</span>
					</a>
				</li>
				{% endif %}
				{% endwith %}

			</ul>
		</div>
		<!-- /main navigation -->

	</div>
	<!-- /sidebar content -->

</div>
<!-- /main sidebar -->
