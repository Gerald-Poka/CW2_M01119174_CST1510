{% load static %}
<!-- Main sidebar -->
<div class="sidebar sidebar-dark sidebar-main sidebar-expand-lg sidebar-theme-navy">

	<!-- Sidebar header -->
	<div class="sidebar-section px-3 py-2 border-bottom border-white border-opacity-10 d-flex align-items-center justify-content-between">
		<span class="fw-bold text-white fs-6 mb-0">Navigation</span>
		<div class="sidebar-resize-hide">
			<button type="button" class="btn btn-flat-white btn-icon btn-sm rounded-circle sidebar-control sidebar-main-resize d-none d-lg-inline-flex text-white">
				<i class="ph-arrows-left-right"></i>
			</button>
			<button type="button" class="btn btn-flat-white btn-icon btn-sm rounded-circle sidebar-mobile-main-toggle d-lg-none text-white">
				<i class="ph-x"></i>
			</button>
		</div>
	</div>
	<!-- /sidebar header -->

	<!-- Sidebar content (Single Column List) -->
	<div class="sidebar-content">
		<div class="sidebar-section p-0">
			<ul class="nav nav-sidebar flex-column w-100 p-0" data-nav-type="accordion">

				{% with active=request.resolver_match.url_name %}
				<li class="nav-item border-bottom border-white border-opacity-10">
					<a href="{% url 'cyber:dashboard' %}" class="nav-link py-2.5 px-3 {% if active == 'dashboard' %}active{% endif %}">
						<i class="ph-house me-2.5 fs-5"></i>
						<span>Dashboard</span>
					</a>
				</li>
				<li class="nav-item border-bottom border-white border-opacity-10">
					<a href="{% url 'cyber:ai_assistant' %}" class="nav-link py-2.5 px-3 {% if active == 'ai_assistant' %}active{% endif %}">
						<i class="ph-chat-circle me-2.5 fs-5"></i>
						<span>AI Assistant</span>
					</a>
				</li>
				<li class="nav-item border-bottom border-white border-opacity-10">
					<a href="{% url 'cyber:cyber_agent' %}" class="nav-link py-2.5 px-3 {% if active == 'cyber_agent' %}active{% endif %}">
						<i class="ph-robot me-2.5 fs-5"></i>
						<span>Cyber Agent</span>
					</a>
				</li>
				<li class="nav-item border-bottom border-white border-opacity-10">
					<a href="{% url 'cyber:analysis_reports' %}" class="nav-link py-2.5 px-3 {% if active == 'analysis_reports' %}active{% endif %}">
						<i class="ph-chart-bar me-2.5 fs-5"></i>
						<span>Analysis Reports</span>
					</a>
				</li>
				<li class="nav-item border-bottom border-white border-opacity-10">
					<a href="{% url 'cyber:profile' %}" class="nav-link py-2.5 px-3 {% if active == 'profile' %}active{% endif %}">
						<i class="ph-user me-2.5 fs-5"></i>
						<span>Profile</span>
					</a>
				</li>

				{% if request.session.role == 'Administrator' %}
				<li class="nav-item border-bottom border-white border-opacity-10">
					<a href="{% url 'cyber:admin_management' %}" class="nav-link py-2.5 px-3 {% if active == 'admin_management' %}active{% endif %}">
						<i class="ph-shield-check me-2.5 fs-5"></i>
						<span>Admin Management</span>
					</a>
				</li>
				{% endif %}
				{% endwith %}

			</ul>
		</div>
	</div>
	<!-- /sidebar content -->

</div>
<!-- /main sidebar -->
